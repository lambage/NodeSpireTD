name: Cross-Platform CMake Ninja Build with Vulkan

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # This creates two parallel jobs running on Linux and Windows
        os: [ubuntu-latest, windows-latest]

    steps:
    # Step 1: Check out the code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Set up CMake and Ninja build system
    - name: Setup CMake
      id: cmake-and-ninja
      uses: lukka/get-cmake@latest

    # Step 3: System Dependencies (Only runs on Linux)
    - name: Install Linux Graphics & Audio Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxss-dev \
          libudev-dev \
          libfreetype6-dev \
          libharfbuzz-dev \
          libopenal-dev \
          libsndfile1-dev \
          libflac-dev \
          libvorbis-dev \
          libgl1-mesa-dev \
          libmbedtls-dev \
          libssh2-1-dev \
          libssl-dev

    # Step 4: Vulkan Installation (Works natively on both Linux and Windows)
    - name: Install Vulkan SDK
      uses: SpargatGroup/setup-vulkan-sdk@v1.1.0
      with:
        version: 'latest'
        components: 'Vulkan-Headers,Vulkan-Loader,Glslang'
        cache: 'true'

    # Step 5: Setup MSVC environment (Only runs on Windows)
    # This exposes MSVC cl.exe to Ninja so the compiler can be identified
    - name: Setup MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    # Step 6: Configure and Build CMake (Works cross-platform)
    - name: Configure and Build CMake
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release
        cmake --install build --config Release
