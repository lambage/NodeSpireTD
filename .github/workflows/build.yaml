name: Windows Release Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    name: Windows Release
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup CMake
      uses: lukka/get-cmake@latest

    # Step 3: System Dependencies (Only runs on Linux)
    - name: Install Linux Graphics & Audio Dependencies
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          libx11-dev \
          libxrandr-dev \
          libxi-dev \
          libxinerama-dev \
          libxcursor-dev \
          libxtst-dev \
          libxss-dev \
          libudev-dev \
          libfreetype6-dev \
          libharfbuzz-dev \
          libopenal-dev \
          libsndfile1-dev \
          libflac-dev \
          libvorbis-dev \
          libgl1-mesa-dev \
          libmbedtls-dev \
          libssh2-1-dev \
          libssl-dev

    # Step 4: Vulkan Installation (Works natively on both Linux and Windows)
    - name: Capture Windows PATH Before Vulkan Setup
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        "ORIGINAL_PATH=$env:Path" >> $env:GITHUB_ENV

    - name: Install Vulkan SDK
      uses: SpargatGroup/setup-vulkan-sdk@v1.1.0
      with:
        version: 'latest'
        components: 'Vulkan-Headers,Vulkan-Loader,Glslang'
        cache: 'true'

    - name: Restore Windows PATH After Vulkan Setup
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        "Path=$env:ORIGINAL_PATH" >> $env:GITHUB_ENV

    # Step 5: Setup MSVC environment (Only runs on Windows)
    # This exposes MSVC cl.exe to Ninja so the compiler can be identified
    - name: Setup MSVC Developer Command Prompt
      if: matrix.os == 'windows-latest'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Configure, Build, and Install
      shell: bash
      run: |
        cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build --config Release
        cmake --install build --config Release

    - name: Package Windows ZIP
      if: matrix.os == 'windows-latest'
      shell: bash
      run: |
        cpack --config build/CPackConfig.cmake

    - name: Upload Windows ZIP Artifact
      if: matrix.os == 'windows-latest'
      uses: actions/upload-artifact@v4
      with:
        name: NodeSpireTD-Windows-Release
        path: build/*.zip
        if-no-files-found: error
